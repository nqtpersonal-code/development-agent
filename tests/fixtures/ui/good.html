<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>good</title>
<style>
  body { margin: 0; font-family: sans-serif; padding: 16px 16px 96px; }
  form { max-width: 900px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  label { display: flex; flex-direction: column; gap: 4px; }
  input { height: 44px; font-size: 16px; }
  .bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: #fff; }
  button { min-height: 48px; width: 100%; font-size: 16px; }
</style>
</head>
<body>
  <form>
    <label>Họ tên học sinh đầy đủ<input id="name"></label>
    <label>Số điện thoại<input id="phone" type="tel"></label>
  </form>
  <div class="bar"><button type="button">Lưu</button></div>
</body>
</html>
